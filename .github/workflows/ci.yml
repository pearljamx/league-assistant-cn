name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements-lock.txt
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: |
          python -m venv .venv-ocr
          .\.venv-ocr\Scripts\python.exe -m pip install -r worker/requirements-lock.txt
          .\.venv-ocr\Scripts\python.exe -m unittest discover -s worker/tests -v
      - run: npm run ocr:build
      - run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
