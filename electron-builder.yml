appId: cn.leagueassistant.desktop
productName: PEARLJAM HEX
directories:
  output: dist
files:
  - out/**/*
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - resources/icon.png
asarUnpack:
  - node_modules/koffi/**/*
  - node_modules/@koromix/**/*
extraResources:
  - from: artifacts/third-party-licenses
    to: third-party-licenses
    filter:
      - "**/*"
  - from: worker/dist/league-ocr
    to: ocr
    filter:
      - "**/*"
win:
  icon: resources/icon.ico
  executableName: PearljamHex
  target:
    - nsis
    - portable
nsis:
  artifactName: PearljamHex-${version}-${arch}-Setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  deleteAppDataOnUninstall: false
portable:
  artifactName: PearljamHex-${version}-${arch}-Portable.${ext}
